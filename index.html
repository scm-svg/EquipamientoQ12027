*{box-sizing:border-box}
body{background:var(--plane);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.45;-webkit-text-size-adjust:100%}

const tip=document.getElementById('tip');
const showTip=(e,h)=>{tip.innerHTML=h;tip.style.opacity=1;moveTip(e)};
function moveTip(e){const r=tip.getBoundingClientRect();let x=e.clientX+14,y=e.clientY-10;
  if(x+r.width>innerWidth-8)x=e.clientX-r.width-14;if(y<4)y=4;tip.style.left=x+'px';tip.style.top=y+'px'}
const hideTip=()=>tip.style.opacity=0;
function hook(n,h){n.addEventListener('pointerenter',e=>showTip(e,h));n.addEventListener('pointermove',moveTip);n.addEventListener('pointerleave',hideTip)}
const SVGNS='http://www.w3.org/2000/svg',CV='var(--surface)';
function svg(w,h){const s=document.createElementNS(SVGNS,'svg');s.setAttribute('viewBox',`0 0 ${w} ${h}`);s.setAttribute('preserveAspectRatio','xMinYMin meet');s.style.width='100%';s.style.minWidth=w+'px';s.style.height='auto';return s}
function sn(p,t,a){const e=document.createElementNS(SVGNS,t);for(const k in a)e.setAttribute(k,a[k]);p.appendChild(e);return e}
function stx(p,x,y,t,o={}){const e=sn(p,'text',{x,y,'font-size':o.fs||11,fill:o.fill||'var(--muted)','text-anchor':o.ta||'start','font-weight':o.fw||400});e.textContent=t;return e}

function seasonBars(host){
  const W=Math.max(560,host.clientWidth||600),Hh=150,ml=34,mr=8,mt=20,mb=32,vals=D.estac;
  const max=Math.ceil(Math.max(...vals)*10)/10,n=vals.length,iw=W-ml-mr,bw=Math.min(40,iw/n-9),gap=(iw-bw*n)/(n-1);
  const y=v=>mt+(Hh-mt-mb)*(1-v/max),s=svg(W,Hh);
  sn(s,'line',{x1:ml,x2:W-mr,y1:y(1),y2:y(1),stroke:'var(--axis)','stroke-width':1,'stroke-dasharray':'3 3'});
  stx(s,ml-6,y(1)+4,'1,0',{ta:'end',fs:10});
  vals.forEach((v,i)=>{const inH=i<H,x=ml+i*(bw+gap);
    const r=sn(s,'rect',{x,y:y(v),width:bw,height:Hh-mb-y(v),rx:3,fill:inH?'var(--s1)':'var(--s1-soft)',stroke:CV,'stroke-width':2});
    hook(r,`${MESES[i]} · índice <b>${nf2.format(v)}</b> · ${f0(D.meses[i])} und`);
    stx(s,x+bw/2,y(v)-5,nf2.format(v),{ta:'middle',fs:10,fill:inH?'var(--ink)':'var(--muted)',fw:inH?600:400});
    stx(s,x+bw/2,Hh-mb+14,MESES[i],{ta:'middle',fs:10.5,fill:inH?'var(--ink-2)':'var(--muted)',fw:inH?600:400})});
  host.appendChild(s);
}
function sortable(table,getRows,render){
  table.querySelectorAll('th.th').forEach(th=>{th.tabIndex=0;
    const go=()=>{const k=th.dataset.k,dir=th.dataset.dir==='d'?'a':'d';
      table.querySelectorAll('th.th').forEach(o=>o.removeAttribute('data-dir'));th.dataset.dir=dir;
      const rows=getRows();rows.sort((x,y)=>{let a=x[k],b=y[k];
        if(typeof a==='string'||typeof b==='string'){a=String(a??'').toLowerCase();b=String(b??'').toLowerCase();return dir==='a'?a.localeCompare(b):b.localeCompare(a)}
        a=a??-Infinity;b=b??-Infinity;return dir==='a'?a-b:b-a});render(rows)};
    th.addEventListener('click',go);th.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();go()}})})
}

   ['Productos nuevos',`${f0(DEC_NUE+DEC_LAN)}`,'<span class="u"> und</span>','4 solicitudes en P1 - Productos Nuevos: Travel Bag 40L (NEW), Toalla Estampada 3.0, Porta cables y Essentials (new).'],
   ['Factor modelo nuevo','Hereda la demanda','txt','Los modelos que sustituyen toman la demanda y el stock del modelo anterior. Los lanzamientos sin historia llevan una cantidad definida a mano.'],
   ['Marketing','Apoyo al lanzamiento','txt','Se contempla el apoyo de marketing para el lanzamiento de los productos nuevos.'],
   ['Disponibilidad y corporativo','Dos factores','txt','Las cantidades incluyen el factor de disponibilidad y el factor corporativo del modelo de proyección.'],
   ['Prioridades','P1 · P2 · P3','txt','P1: 3 o más variantes en cero a marzo; P2: 1 o 2; P3: ninguna. Ajustes a mano: Citybag y Backpack Flex a P1; Sunny Cord y las socks a P3.']
  ];
  F2.forEach(([h,v,ex,t])=>g2.appendChild(el('div','f',
    `<h3>${h}</h3><div class="big${ex==='txt'?' txt':''}">${v}${ex==='txt'?'':ex}</div><p>${t}</p>`)));
  g2.style.marginTop='12px';
  p.appendChild(g2);

  const c=el('div','card');
  c.innerHTML=`<h2>Estacionalidad · en azul los ${H} meses de esta compra</h2>`;
  const ch=el('div','chart');c.appendChild(ch);
  c.insertAdjacentHTML('beforeend',`<p style="margin:10px 0 0;font-size:13px;color:var(--ink-2)">Marzo a julio son los meses de menor venta (0,62 a 0,93). Noviembre y diciembre pesan 1,79 y 2,28: si la compra tiene que cubrirlos, el total sube mucho más que proporcionalmente.</p>`);
  p.appendChild(c);
  requestAnimationFrame(()=>seasonBars(ch));
  return p;
}

const TABS=[['compra','La compra',panelCompra],['modelo','Por modelo',panelModelo],['porque','Por qué',panelPorque]];
const nav=document.getElementById('nav'),main=document.getElementById('main'),cache={};
function show(id,push){
  const t=TABS.find(x=>x[0]===id)||TABS[0];
  nav.querySelectorAll('button').forEach(b=>b.setAttribute('aria-selected',String(b.dataset.id===t[0])));
  main.innerHTML='';if(!cache[t[0]])cache[t[0]]=t[2]();main.appendChild(cache[t[0]]);
  if(push&&location.hash.slice(1)!==t[0])location.hash=t[0];
  window.scrollTo({top:0,behavior:'instant'});
}
TABS.forEach(([id,label])=>{const b=el('button',null,label);b.dataset.id=id;b.setAttribute('role','tab');b.setAttribute('aria-selected','false');
  b.addEventListener('click',()=>show(id,true));nav.appendChild(b)});
const start=(location.hash||'').slice(1);
show(TABS.some(t=>t[0]===start)?start:'compra',false);
addEventListener('hashchange',()=>{const h=location.hash.slice(1);if(TABS.some(t=>t[0]===h))show(h,false)});
let rt;addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(()=>{const cur=nav.querySelector('[aria-selected="true"]').dataset.id;delete cache[cur];show(cur,false)},220)});
</script>
